name: Ошибка на устройстве
description: Сбой, отсутствие кнопки или ошибка перевода
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Версии iOS, YouTube и патча
      placeholder: iOS / YouTube / DN VOT
    validations:
      required: true
  - type: input
    id: video
    attributes:
      label: Публичная ссылка на тестовый ролик
  - type: textarea
    id: steps
    attributes:
      label: Действия и наблюдаемый результат
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Диагностика из панели перевода или отчёт сбоя
      description: Удалите секреты, cookies, токены и подписанные URL аудио перед отправкой.
