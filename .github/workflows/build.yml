name: Manual Linux build and checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Configure toolchain directory
        run: printf 'IOS_TOOLCHAIN_ROOT=%s/ios-toolchain\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install protobuf==6.33.0
      - name: Restore pinned LLVM and SDK
        run: python tools/setup_toolchain.py
      - name: Build ARM64 iOS library
        run: bash build.sh
      - name: Run core tests and validate Mach-O
        run: bash test.sh
      - name: Upload library and verification
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: DNYouTubeVOT-arm64-ios
          path: |
            build/DNYouTubeVOT.dylib
            build/DNYouTubeVOTProbe.dylib
            build/probe-verification.json
            build/macho-verification.json
            build/dependencies.txt
          if-no-files-found: error
          retention-days: 14
